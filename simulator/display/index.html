<!DOCTYPE html>
<html lang="no">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Love Box</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <main class="love-box">

        <section class="screen">

            <div
                id="ambient-hearts"
                class="ambient-hearts"
            >
                ♡ ♡ ♡
            </div>

            <article
                id="message-card"
                class="message-card theme-idle"
            >

                <div
                    id="message-icon"
                    class="message-icon"
                >
                    💗
                </div>

                <div
                    id="message-type"
                    class="message-type"
                >
                    LOVE BOX
                </div>

                <h1 id="message-title">
                    Love Box ❤️
                </h1>

                <p id="message-body">
                    Venter på en melding...
                </p>

                <button
                    id="ack-button"
                    class="ack-button"
                    hidden
                >
                    ❤️ Sett
                </button>

            </article>

            <div
                id="status"
                class="status"
            >
                ● Kobler til...
            </div>

        </section>

    </main>

    <script src="app.js"></script>

</body>

</html>
