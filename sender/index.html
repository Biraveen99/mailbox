<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#f267a0"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="Love Box"
    >

    <title>Love Box</title>

    <link
        rel="manifest"
        href="manifest.json"
    >

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <main class="app">

        <div class="logo">
            💗
        </div>

        <h1>Love Box</h1>

        <p class="subtitle">
            Send noe fint
        </p>

        <section class="card">

            <label>
                Type
            </label>

            <div class="type-grid">

                <button
                    class="type-button active"
                    data-type="message"
                    type="button"
                >
                    💌 Melding
                </button>

                <button
                    class="type-button"
                    data-type="compliment"
                    type="button"
                >
                    💕 Kompliment
                </button>

                <button
                    class="type-button"
                    data-type="date"
                    type="button"
                >
                    🌹 Date plan
                </button>

                <button
                    class="type-button"
                    data-type="surprise"
                    type="button"
                >
                    ✨ Surprise
                </button>

            </div>

            <label for="title">
                Tittel
            </label>

            <input
                id="title"
                type="text"
                placeholder="Til deg ❤️"
                maxlength="80"
            >

            <label for="body">
                Melding
            </label>

            <textarea
                id="body"
                placeholder="Skriv noe fint..."
                maxlength="600"
            ></textarea>

            <button
                id="send-button"
                class="send-button"
                type="button"
            >
                Send ❤️
            </button>

            <p
                id="status"
                class="status"
            ></p>

        </section>

    </main>

    <script src="app.js"></script>

</body>
</html>
